[project]
name = "OmniLRS"
version = "3.0.0"
description = "A IsaacSim based lunar simulator for rover locomotion."
requires-python = ">=3.11"
keywords = ["lunar", "simulator", "rover", "locomotion", "IsaacSim"]
authors = [
    { name = "Antoine Richard", email = "antoine.richard@uni.lu" },
    { name = "Junnosuke Kamohara", email = "jkamohara3@gatech.edu" },
]

dependencies = [
    "skyfield",
    "zfpy",
    "numba",
    "gdown",
    "gdal",
    "omegaconf",
    "hydra-core",
    "opencv-python",
    "av",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# WorldBuilders is a vendored git submodule — don't lint/format third-party code.
extend-exclude = ["WorldBuilders"]

[tool.ruff.lint]
# Ruff's default rule set (E4/E7/E9 + Pyflakes) plus import sorting (I).
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# Submodule is absent in the CI lint checkout; pin it so import order matches locally.
known-third-party = ["WorldBuilders"]

[project.optional-dependencies]
# Isaac Sim 6.2 already provides Warp 1.17. Installing warp-lang into that
# environment replaces it. This extra is only for a machine without Isaac.
dev-warp = ["warp-lang>=1.8.1"]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
